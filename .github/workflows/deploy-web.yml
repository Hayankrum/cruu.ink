name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2-stable
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: ~/godot-templates
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Install Godot e export templates
        run: |
          set -e
          mkdir -p ~/godot-templates
          if [ ! -f ~/godot-templates/version.ok ]; then
            curl -sL -o /tmp/tpz.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
            mkdir -p /tmp/tpz
            unzip -q /tmp/tpz.tpz -d /tmp/tpz
            mkdir -p ~/godot-templates/4.7.2.stable
            cp -r /tmp/tpz/templates/* ~/godot-templates/4.7.2.stable/
            touch ~/godot-templates/version.ok
          fi
          mkdir -p ~/.local/share/godot/export_templates
          ln -sfn ~/godot-templates/4.7.2.stable ~/.local/share/godot/export_templates/4.7.2.stable
          curl -sL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 "/tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot

      - name: Import do projeto
        run: godot --headless --path . --import || true

      - name: Export Web
        run: |
          mkdir -p Build/web
          godot --headless --path . --export-release "Web"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
